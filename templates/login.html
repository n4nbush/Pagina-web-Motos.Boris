{% extends "base.html" %}
{% block title %}Acceso privado · Motos Boris{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card">
    <p class="eyebrow">ÁREA PRIVADA</p><h1>Acceso al<br><em>catálogo.</em></h1>
    {% if error %}<p class="form-message error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>Usuario<input name="username" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Ingresar <span>→</span></button>
    </form>
  </div>
</section>
{% endblock %}
