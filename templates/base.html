<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Motos Boris{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand-mark" href="{{ url_for('index') }}"><span>M</span> MOTOS BORIS</a>
    <nav><a href="{{ url_for('index') }}">Presupuestos</a>{% if session.get('admin_authenticated') %}<a href="{{ url_for('admin') }}">Panel privado</a><a href="{{ url_for('logout') }}">Salir</a>{% endif %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Servicio y mantenimiento de motos · Motos Boris</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
